
# Issam : Configuration du port du serveur
server.port=9090

# Issam : Configuration de la session (optionnel)
server.servlet.session.timeout=30m

# Issam : Configuration de l'encodage
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Issam : Configuration de Spring Security (optionnel)
# spring.security.user.name=issam
# spring.security.user.password=issam123
# spring.security.user.roles=USER

# Issam : Configuration Thymeleaf (désactiver le cache pour le développement)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html