<!DOCTYPE html>
<!-- Issam : Déclaration du type de document HTML5 -->
<!-- Issam : xmlns:th="http://www.thymeleaf.org" permet d'utiliser les expressions Thymeleaf -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- Issam : Titre personnalisé pour le tableau de bord administrateur -->
    <title>Admin Dashboard - Issam</title>
    <style>
        /* Issam : Style CSS pour la page administrateur */
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2b5797;
        }
        .admin-info {
            background-color: #e8f0fe;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Issam : Titre du tableau de bord administrateur -->
    <h2> Espace Administrateur - Issam</h2>

    <div class="admin-info">
        <!-- Issam : Section réservée aux utilisateurs ayant le rôle ADMIN -->
        <p> Section réservée aux utilisateurs ayant le rôle <strong>ADMIN</strong>.</p>
        <p> Vous avez accès à toutes les fonctionnalités d'administration.</p>
        <p> Gestion des utilisateurs, paramètres système, et rapports.</p>
    </div>

    <!-- Issam : Lien de déconnexion vers /logout intercepté par Spring Security -->
    <a th:href="@{/logout}">🚪 Déconnexion</a>
</div>
</body>
</html>
